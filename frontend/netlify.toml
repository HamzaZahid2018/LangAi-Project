[build]
publish = "."
command = ""

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[dev]
publish = "."

[context.production.environment]
NODE_VERSION = "18"

[[headers]]
for = "/*"
[headers.values]
X-Content-Type-Options = "nosniff"
X-Frame-Options = "DENY"
X-XSS-Protection = "1; mode=block"
Referrer-Policy = "no-referrer-when-downgrade"
